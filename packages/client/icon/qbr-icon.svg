<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" shape-rendering="crispEdges">
  <!-- QBR app icon source (v2, simplified per user 2026-09-25): just a mini
       spreadsheet, centred and straight-on, laid out like the game's vertical
       board — Finance's side shaded red on top, yours blue at the bottom.
       Flat colours, no mascot, no text, no tilt or shadow, so it stays crisp at
       home-screen size. Tints are a notch deeper than the in-game pastels so the
       two sides read at 60px. 90s office, evoked not copied: no Excel/Office
       marks (see CLAUDE.md IP guardrails). iOS applies the corner mask.
       Re-render: see packages/client/icon/README.md. -->
  <rect width="1024" height="1024" fill="#0f7b7b" />

  <!-- Sheet: outer frame, header strip, row-number gutter, body. -->
  <rect x="184" y="154" width="656" height="716" fill="#1d1d1d" />
  <rect x="192" y="162" width="640" height="700" fill="#ffffff" />
  <rect x="192" y="162" width="640" height="72" fill="#c3c3c3" />
  <rect x="192" y="162" width="72" height="700" fill="#c3c3c3" />

  <!-- Finance's side (top row) and yours (bottom row). -->
  <rect x="264" y="234" width="568" height="126" fill="#f2a79d" />
  <rect x="264" y="736" width="568" height="126" fill="#9cc2f2" />

  <!-- Grid lines: 3 lanes x 5 rows, plus the header/gutter rules. -->
  <g fill="#8a8a8a">
    <rect x="453" y="162" width="6" height="700" />
    <rect x="643" y="162" width="6" height="700" />
    <rect x="258" y="162" width="6" height="700" />
    <rect x="192" y="228" width="640" height="6" />
    <rect x="192" y="357" width="640" height="6" />
    <rect x="192" y="483" width="640" height="6" />
    <rect x="192" y="609" width="640" height="6" />
    <rect x="192" y="733" width="640" height="6" />
  </g>
</svg>
